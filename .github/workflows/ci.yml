name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_transfer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_transfer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=football_transfer_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore AI-Football-Transfer-Platform.slnx
      - run: dotnet build AI-Football-Transfer-Platform.slnx --configuration Release --no-restore --warnaserror
      - run: dotnet test AI-Football-Transfer-Platform.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FootballTransfer.Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FootballTransfer.Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
