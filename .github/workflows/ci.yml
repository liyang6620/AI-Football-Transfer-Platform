name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore AI-Football-Transfer-Platform.slnx
      - run: dotnet build AI-Football-Transfer-Platform.slnx --configuration Release --no-restore --warnaserror

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FootballTransfer.Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FootballTransfer.Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
