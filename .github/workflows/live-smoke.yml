name: Live Demo Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_MAX_ATTEMPTS: 6
      SMOKE_REQUEST_TIMEOUT_MS: 70000
      SMOKE_MAX_BACKOFF_MS: 60000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test transient retry behavior
        run: node --test tools/live-smoke.test.mjs
      - name: Run live endpoint smoke checks
        run: node tools/live-smoke.mjs
      - name: Audit transfer data invariants
        run: node tools/audit-live-data.mjs
