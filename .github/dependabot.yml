version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  - package-ecosystem: "nuget"
    directory: "/FootballTransfer.Api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/FootballTransfer.Frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
